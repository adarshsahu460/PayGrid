    static_configs:
      - targets: ['kafka-exporter:9308']
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3001']
  - job_name: 'psp-service'
    static_configs:
      - targets: ['psp-service:3002']
  - job_name: 'card-network'
    static_configs:
      - targets: ['card-network:3003']
  - job_name: 'issuing-bank'
    static_configs:
      - targets: ['issuing-bank:3004']
  - job_name: 'acquiring-bank'
    static_configs:
      - targets: ['acquiring-bank:3005']
  - job_name: '3ds-service'
    static_configs:
      - targets: ['3ds-service:3008'] 