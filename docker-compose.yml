services:
  kafka:
    image: bitnami/kafka:3.4
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LOG_DIRS=/tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
  kafka-init-topics:
    image: bitnami/kafka:3.4
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 10 && \
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-requests-dead-letter --replication-factor 1 --partitions 1 --config retention.ms=604800000 && \
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-responses-dead-letter --replication-factor 1 --partitions 1 --config retention.ms=604800000 && \
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments-dead-letter --replication-factor 1 --partitions 1 --config retention.ms=604800000"
    networks:
      - default
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: paygrid
      POSTGRES_PASSWORD: paygrid
      POSTGRES_DB: paygrid
    ports:
      - "5432:5432"
    volumes:
      - ./services/payment-service/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000" 
    depends_on:
      - payment-service
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - kafka
      - postgres
      - redis
  card-network:
    build:
      context: .
      dockerfile: services/card-network/Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      - kafka
  issuing-bank:
    build:
      context: .
      dockerfile: services/issuing-bank/Dockerfile
    ports:
      - "3004:3004"
    depends_on:
      - kafka
  acquiring-bank:
    build:
      context: .
      dockerfile: services/acquiring-bank/Dockerfile
    ports:
      - "3005:3005"
    depends_on:
      - kafka
  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    ports:
      - "3010:3010"
    depends_on:
      - kafka
      - postgres
    environment:
      - POSTGRES_USER=paygrid
      - POSTGRES_PASSWORD=paygrid
      - POSTGRES_DB=paygrid
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
volumes:
  kafka-data:
networks:
  default:
    name: paygrid-net