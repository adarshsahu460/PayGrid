services:
  kafka:
    image: bitnami/kafka:3.4
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LOG_DIRS=/tmp/kraft-combined-logs
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
  kafka-init-topics:
    image: bitnami/kafka:3.4
    depends_on:
      - kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 10 && \
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-requests-dead-letter --replication-factor 1 --partitions 1 --config retention.ms=604800000 && \
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-responses-dead-letter --replication-factor 1 --partitions 1 --config retention.ms=604800000 && \
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments-dead-letter --replication-factor 1 --partitions 1 --config retention.ms=604800000"
    networks:
      - default
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: paygrid
      POSTGRES_PASSWORD: paygrid
      POSTGRES_DB: paygrid  
    ports:
      - "5432:5432"
    volumes:
      - ./services/payment-service/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygrid"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
  redis:
    image: redis:6.2
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000" 
    env_file:
      - ./services/api-gateway/.env
    depends_on:
      - payment-service :
          condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
  payment-service:
    build: ./services/payment-service
    ports:
      - "3001:3001"
    env_file:
      - ./services/payment-service/.env
    depends_on:
      - kafka :
        condition: service_healthy
      - postgres :
        condition: service_healthy
      - redis : 
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
  card-network:
    build: ./services/card-network
    ports:
      - "3003:3003"
    env_file:
      - ./services/card-network/.env
    depends_on:
      - kafka : 
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
  issuing-bank:
    build: ./services/issuing-bank
    ports:
      - "3004:3004"
    env_file:
      - ./services/issuing-bank/.env
    depends_on:
      - kafka : 
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
  acquiring-bank:
    build: ./services/acquiring-bank
    ports:
      - "3005:3005"
    env_file:
      - ./services/acquiring-bank/.env
    depends_on:
      - kafka : 
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
  ledger-service: 
    build: ./services/ledger-service
    ports:
      - "3010:3010"
    env_file:
      - ./services/ledger-service/.env
    depends_on:
      - kafka : 
        condition: service_healthy
      - postgres : 
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
  debezium:
    image: debezium/connect:2.4
    depends_on:
      - kafka : 
        condition: service_healthy
      - postgres : 
        condition: service_healthy
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=debezium
      - CONFIG_STORAGE_TOPIC=debezium-configs
      - OFFSET_STORAGE_TOPIC=debezium-offsets
      - STATUS_STORAGE_TOPIC=debezium-status  
      - CONNECTOR_CLASS=io.debezium.connector.postgresql.PostgresConnector
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=paygrid
      - DATABASE_PASSWORD=paygrid
      - DATABASE_DBNAME=paygrid
      - PLUGIN_NAME=pgoutput
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - default
  notification-service:
    build: ./services/notification-service
    ports:
      - "3006:3006"
    env_file:
      - ./services/notification-service/.env
    depends_on:
      - kafka : 
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
  tokenization-service:
    build: ./services/tokenization-service
    ports:
      - "3007:3007"
    env_file:
      - ./services/tokenization-service/.env
    restart: unless-stopped
    networks:
      - default
  fraud-detection-service:
    build: ./services/fraud-detection-service
    ports:
      - "3008:3008"
    env_file:
      - ./services/fraud-detection-service/.env
    depends_on:
      - kafka : 
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
  history-service:
    build: ./services/history-service
    env_file:
      - ./services/history-service/.env
    depends_on:
      - kafka:
          condition: service_healthy
      - postgres:
          condition: service_healthy
    restart: unless-stopped
    networks:
      - default
volumes:
  kafka-data:
networks:
  default:
    name: paygrid-net
