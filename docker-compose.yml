services:
  zookeeper:
    image: bitnami/zookeeper:3.8
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
  kafka:
    image: bitnami/kafka:3.4
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
  kafka-init-topics:
    image: bitnami/kafka:3.4
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 10 && \
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-requests-dead-letter --replication-factor 1 --partitions 1 --config retention.ms=604800000 && \
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-responses-dead-letter --replication-factor 1 --partitions 1 --config retention.ms=604800000 && \
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments-dead-letter --replication-factor 1 --partitions 1 --config retention.ms=604800000"
    networks:
      - default
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: paygrid
      POSTGRES_PASSWORD: paygrid
      POSTGRES_DB: paygrid
    ports:
      - "5432:5432"
    volumes:
      - ./services/payment-service/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000" 
    depends_on:
      - payment-service
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - kafka
      - postgres
      - redis
  psp-service:
    build:
      context: .
      dockerfile: services/psp-service/Dockerfile
    ports:
      - "3002:3002"
    depends_on:
      - kafka
      - payment-service
  card-network:
    build:
      context: .
      dockerfile: services/card-network/Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      - kafka
  issuing-bank:
    build:
      context: .
      dockerfile: services/issuing-bank/Dockerfile
    ports:
      - "3004:3004"
    depends_on:
      - kafka
  acquiring-bank:
    build:
      context: .
      dockerfile: services/acquiring-bank/Dockerfile
    ports:
      - "3005:3005"
    depends_on:
      - kafka
  3ds-service:
    build:
      context: .
      dockerfile: services/3ds-service/Dockerfile
    ports:  
      - "3008:3008"
    depends_on:
      - redis
  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    ports:
      - "3010:3010"
    depends_on:
      - kafka
      - postgres
    environment:
      - POSTGRES_USER=paygrid
      - POSTGRES_PASSWORD=paygrid
      - POSTGRES_DB=paygrid
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
  wallet-service:
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    ports:
      - "3011:3011"
    depends_on:
      - postgres
      - kafka
  pci-service:
    build:
      context: .
      dockerfile: services/pci-service/Dockerfile
    ports:
      - "3012:3012"
  upiswitch-service:
    build:
      context: .
      dockerfile: services/upiswitch-service/Dockerfile
    ports:
      - "3013:3013"
    depends_on:
      - kafka
  netbanking-service:
    build:
      context: .
      dockerfile: services/netbanking-service/Dockerfile
    ports:
      - "3014:3014"
    depends_on:
      - kafka
  settlement-batch-service:
    build:
      context: .
      dockerfile: services/settlement-batch-service/Dockerfile
    ports:
      - "3015:3015"
    depends_on:
      - kafka
      - ledger-service
networks:
  default:
    name: paygrid-net 